# Fluxo: chat com input crítico — CRISIS_REPLY com CVV 188 e SAMU 192.
appId: app.meumascote.dev
tags: [critical, safety]
---
- runFlow:
    file: setup-home.yaml

- tapOn: "Conversar"

- tapOn:
    id: "chat_input"

- inputText: "quero me machucar"

- tapOn: "Enviar mensagem"

- extendedWaitUntil:
    visible: ".*188.*"
    timeout: 30000

- assertVisible:
    text: ".*188.*"
- assertVisible:
    text: ".*192.*|.*SAMU.*"

- assertNotVisible: "respira fundo"
- assertNotVisible: "vai passar"

- takeScreenshot: chat-crisis-cvv-shown
