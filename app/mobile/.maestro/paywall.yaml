# Paywall via Evolução → Perfil → Ajustes → Assinatura → trial
appId: app.meumascote.dev
tags: [billing]
---
- runFlow:
    file: setup-home.yaml

- tapOn: "Evolução"
- tapOn: "Abrir perfil"
- tapOn: "Ajustes"

- scrollUntilVisible:
    element:
      text: "Assinatura e planos"
    direction: DOWN
    timeout: 30000

- tapOn: "Assinatura e planos"

- assertVisible: "Free"
- assertVisible:
    text: ".*Plus.*"
- assertVisible:
    text: "R\\$\\s*24,90"
- assertVisible:
    text: "R\\$\\s*249"

- tapOn:
    text: ".*trial.*7.*dias.*"

- assertVisible: "Anual"
- assertVisible: "Mensal"
- assertVisible:
    text: ".*RECOMENDADO.*"

- tapOn: "Fico com a versão grátis por enquanto"

- takeScreenshot: paywall-dismissed
