# Fluxo: registrar 1 check-in de hábito a partir da home.
appId: app.meumascote.dev
tags: [critical, daily-loop]
---
- runFlow:
    file: setup-home.yaml

- scrollUntilVisible:
    element:
      text: "Água"
    direction: DOWN
    timeout: 20000

- runFlow:
    when:
      visible: "Bebi 1 copo"
    commands:
      - tapOn: "Bebi 1 copo"

- runFlow:
    when:
      notVisible: "Bebi 1 copo"
    commands:
      - tapOn: "Água"

- runFlow:
    when:
      visible: "Confirmar"
    commands:
      - tapOn: "Confirmar"

- extendedWaitUntil:
    visible: ".*feito hoje.*"
    timeout: 30000

- takeScreenshot: checkin-applied
