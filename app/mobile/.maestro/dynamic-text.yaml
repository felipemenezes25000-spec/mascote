# Fluxo: toggle texto dinâmico em settings.
appId: app.meumascote.dev
tags: [accessibility, settings]
---
- runFlow:
    file: setup-home.yaml

- tapOn: "Evolução"
- tapOn: "Abrir perfil"
- tapOn: "Ajustes"

- scrollUntilVisible:
    element:
      text: "Texto dinâmico do sistema"
    direction: DOWN
    timeout: 20000

- tapOn: "Texto dinâmico do sistema"

- tapOn: "Home"

- extendedWaitUntil:
    visible: "Cuide de você"
    timeout: 30000

- takeScreenshot: dynamic-text-on
