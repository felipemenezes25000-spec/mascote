# Fluxo: settings → exportar dados → verifica que clipboard foi populado.
# Garante que migração de console.log → Clipboard API funcionou.
appId: app.meumascote.dev
tags: [privacy, lgpd]
---
- launchApp:
    stopApp: true

- runFlow:
    when:
      visible: "Começar"
    file: onboarding.yaml

# Navega pra Settings
- tapOn:
    text: "Você|Perfil|Configurações"

# Scroll até "Privacidade"
- scroll
- scroll

- assertVisible:
    text: ".*[Pp]rivacidade.*"

# Tappa "Exportar meus dados"
- tapOn:
    text: ".*[Ee]xportar.*"

# Alert: "Dados copiados" — confirma sucesso
- assertVisible:
    text: ".*copiados.*|.*Dados.*"
- tapOn: "OK"

# IMPORTANTE: confirmar que NÃO existe nenhum texto "console" ou JSON crú visível
- assertNotVisible:
    text: ".*\\{\\\"profiles\\\":.*"

- takeScreenshot: export-via-clipboard
