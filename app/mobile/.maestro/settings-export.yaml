# Fluxo: settings → exportar dados → confirma clipboard.
appId: app.meumascote.dev
tags: [privacy, lgpd]
---
- runFlow:
    file: setup-home.yaml

- tapOn: "Evolução"
- tapOn: "Abrir perfil"
- tapOn: "Ajustes"

- scrollUntilVisible:
    element:
      text: ".*Exportar.*"
    direction: DOWN
    timeout: 20000

- tapOn:
    text: ".*Exportar.*"

- assertVisible:
    text: ".*copiados.*|.*Dados.*"
- tapOn: "OK"

- takeScreenshot: export-via-clipboard
