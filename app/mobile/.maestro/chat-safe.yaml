# Fluxo: chat com mensagem neutra; verifica reply sem trigger de safety.
appId: app.meumascote.dev
tags: [chat, safety]
---
- launchApp:
    stopApp: true

- runFlow:
    when:
      visible: "Começar"
    file: onboarding.yaml

# Navega pra aba Conversar
- tapOn:
    text: "Conversar|Chat"

- tapOn:
    id: "chat_input"

- inputText: "oi mascote, bebi 4 copos de água hoje"
- hideKeyboard
- tapOn:
    text: "Enviar"

# Espera resposta aparecer
- assertVisible:
    text: ".*"
    waitToSettleTimeoutMs: 5000

# Banner CVV deve estar VISÍVEL no chat (sempre, prevenção wellness)
- assertVisible:
    text: ".*188.*|.*CVV.*"

# E o reply NÃO deve conter linguagem médica
- assertNotVisible: "depressão"
- assertNotVisible: "diagnóstico"
- assertNotVisible: "antidepressivo"

- takeScreenshot: chat-safe-reply
