name: CI

# Gate rápido em todo PR: typecheck + testes unitários (~15s).
# E2E Maestro roda em app/mobile/.github/workflows/maestro.yml (mais lento).

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-quality:
    name: Mobile — typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Quality (typecheck + lint + tests)
        run: npm run quality
