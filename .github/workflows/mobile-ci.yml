name: Mobile CI

# Pipeline mobile completo — referencia unity-ci.yml para validação Unity.

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-quality:
    name: Mobile — typecheck, lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests with coverage
        run: npm run test:coverage

  unity-structure:
    name: Unity — estrutura (ref unity-ci.yml)
    uses: ./.github/workflows/unity-ci.yml
